<style>
:root{--bg:#011b30;--s1:#062945;--s2:#0a3961;--bd:#144b74;--tx:#e6f0fa;--mu:#8fa6c1;--ac:#1fd1d6;--ac2:#4a6fd8;--onac:#04202a;--ok:#3ddc97;--wn:#f5b942;--bad:#ff7a88;--sh:6px 6px 14px rgba(0,0,0,.45),-4px -4px 10px rgba(40,80,130,.14);--r:18px;--hi:rgba(255,255,255,.10);--lo:rgba(0,0,0,.35);--g1:rgba(255,255,255,.07)}
:root[data-t=light]{--hi:rgba(255,255,255,.95);--lo:rgba(80,95,140,.28);--g1:rgba(255,255,255,.7);--bg:#e7e2f6;--s1:#f5f5fd;--s2:#dbe2ef;--bd:#c0ccdd;--tx:#1c2544;--mu:#3e6081;--ac:#066a70;--ac2:#3453b8;--onac:#fff;--ok:#0a6e43;--wn:#8a5a00;--bad:#b3261e;--sh:6px 6px 14px #c3cde0,-6px -6px 14px #fff}
@media(prefers-color-scheme:light){:root[data-t=auto]{--bg:#e7e2f6;--s1:#f5f5fd;--s2:#dbe2ef;--bd:#c0ccdd;--tx:#1c2544;--mu:#3e6081;--ac:#066a70;--ac2:#3453b8;--onac:#fff;--ok:#0a6e43;--wn:#8a5a00;--bad:#b3261e;--sh:6px 6px 14px #c3cde0,-6px -6px 14px #fff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 'IBM Plex Sans Arabic','Noto Kufi Arabic',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
button,input,select,textarea{font:inherit;color:inherit}
.card{background:linear-gradient(160deg,var(--g1),transparent 55%),var(--s1);border-radius:var(--r);box-shadow:var(--sh),inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);padding:18px;min-width:0;transform:translateZ(0)}
.btn{background:linear-gradient(180deg,var(--g1),transparent 60%),var(--s2);border:1px solid var(--bd);border-radius:999px;padding:7px 16px;cursor:pointer;box-shadow:0 4px 0 var(--lo),0 8px 14px var(--lo),inset 0 1px 0 var(--hi);display:inline-flex;gap:6px;align-items:center;transition:transform .08s,box-shadow .08s;position:relative}.btn:active,.btn[aria-pressed=true]{transform:translateY(3px);box-shadow:0 1px 0 var(--lo),inset 0 3px 8px var(--lo)}.btn[aria-pressed=true]{color:var(--ac);border-color:var(--ac)}
.btn:hover{border-color:var(--ac)}.btn.p{background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%),var(--ac);color:var(--onac);border-color:var(--ac);font-weight:600}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;width:100%}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px}
.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.c3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.big{font-size:30px;font-weight:700;line-height:1.2}.mu{color:var(--mu)}
.chip{display:inline-flex;gap:5px;align-items:center;padding:2px 10px;border-radius:999px;font-size:12.5px;border:1px solid currentColor;font-weight:600}
.ok{color:var(--ok)}.wn{color:var(--wn)}.bad{color:var(--bad)}.ac{color:var(--ac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:13px}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--s2)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--s1);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.lgb{display:flex;justify-content:center;align-items:center;background:transparent;padding:6px 0;margin-bottom:8px}.lgb img{height:84px;width:auto;max-width:100%;object-fit:contain;aspect-ratio:324/420;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 8px rgba(255,255,255,.3))}:root[data-t=light] .lgb img{filter:none}.side img{flex:none}.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;cursor:pointer;color:var(--mu)}
.side a.on{background:var(--s2);color:var(--ac);box-shadow:inset 2px 2px 6px rgba(0,0,0,.25)}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 22px}.main{padding:0 22px 40px}
.ban{background:var(--s2);color:var(--wn);text-align:center;font-size:12.5px;padding:4px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lg{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 28px)}
.car{position:relative;overflow:hidden;background:var(--s2)}.trk{display:flex;height:100%;transition:transform .6s ease}
.sl{min-width:100%;position:relative}.sl svg{width:100%;height:100%;display:block}
.cap{position:absolute;inset-inline:0;bottom:0;padding:50px 24px 56px;background:rgba(5,15,30,.82);color:#e6f0fa;direction:inherit;font-weight:600}
.dots{position:absolute;bottom:16px;inset-inline:0;display:flex;gap:8px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:#8fa6c1;cursor:pointer}.dots i.on{background:var(--ac);width:26px;border-radius:6px}
.arr{position:absolute;top:45%;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(5,15,30,.7);color:#e6f0fa;cursor:pointer}
.form{display:flex;align-items:center;justify-content:center;padding:24px}.form .card{width:min(420px,100%)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto}
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto}.kan>div{background:var(--s2);border-radius:14px;padding:10px;min-height:120px}
.tk{background:var(--s1);border-radius:12px;padding:10px;margin-top:8px;font-size:13.5px}
.opt{display:flex;gap:6px;flex-wrap:wrap}.opt button{padding:5px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--s2);cursor:pointer}.opt button.on{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:600}
.q{padding:12px 0;border-bottom:1px solid var(--bd)}
.pb{height:10px;border-radius:6px;background:var(--s2);overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--s1);border:1px solid var(--ac);padding:10px 16px;border-radius:14px;z-index:99;box-shadow:var(--sh)}
.fb{position:fixed;bottom:16px;inset-inline-end:16px;z-index:40;padding:8px 14px;font-size:13px}#scr{padding-bottom:84px}@media(max-width:820px){.fbt{display:none}.fb{width:46px;height:46px;padding:0;border-radius:50%;justify-content:center}}
.rv{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.dg{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}.dg>.w2{grid-column:span 2}
@media(max-width:1179px){.dg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:599px){.dg{grid-template-columns:minmax(0,1fr)}.dg>.w2{grid-column:auto}}
.lgr{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}.lgr i{width:12px;height:12px;border-radius:4px;flex:none}.lgr span:first-of-type{flex:1;min-width:0}
.hbr{display:grid;grid-template-columns:minmax(70px,34%) 1fr 34px;gap:8px;align-items:center;padding:6px 0;font-size:13.5px}.hbt{height:10px;background:var(--s2);border-radius:6px;overflow:hidden}.hbt i{display:block;height:100%;border-radius:6px}.hbr b{text-align:end}
.hm th,.hm td{text-align:center}.hm th{white-space:normal;line-height:1.3;min-width:92px;font-size:12px;vertical-align:bottom}.hm .nm{position:sticky;inset-inline-start:0;background:var(--s1);text-align:start;z-index:1;min-width:120px;box-shadow:1px 0 0 var(--bd)}.hm td .i{width:15px;height:15px;vertical-align:-3px}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto}.lg{grid-template-columns:1fr}.car{height:200px}.kan{grid-template-columns:repeat(5,230px)}.cap{padding:20px 14px 36px;font-size:13px}}
@media(prefers-reduced-motion:reduce){.trk{transition:none}}
@media print{.side,.top,.ban,.fb,.noprint{display:none!important}.app{display:block}body{background:#fff;color:#000}body.pr>*:not(.modal){display:none!important}.modal{position:static;background:#fff;padding:0}.card{background:#fff!important;box-shadow:none!important;color:#000;max-height:none!important;overflow:visible!important}.btn,.rv{display:none!important}:root{--tx:#000;--mu:#333;--bd:#999}}

$('#root').innerHTML=`<div class="lg"><div class="car" id="car"><button class="arr" style="inset-inline-start:10px" onclick="go(-1)" aria-label="prev">‹</button><button class="arr" style="inset-inline-end:10px" onclick="go(1)" aria-label="next">›</button><div class="trk" id="trk">${sl}</div><div class="dots">${[0,1,2,3,4].map(i=>`<i onclick="ci=${i};mv()"></i>`).join('')}</div></div>

<label for="u">${t('user')}</label><input id="u" autocomplete="username"><label for="p">${t('pw')}</label><div style="display:flex;gap:6px"><input id="p" type="password"><button class="btn" onclick="p.type=p.type=='password'?'text':'password'">${ic('eye')}${t('show')}</button></div>

const c=$('#car');c.onmouseenter=()=>clearInterval(ct);c.onmouseleave=auto;c.ontouchstart=e=>{tx0=e.touches[0].clientX;clearInterval(ct)};c.ontouchend=e=>{const d=e.changedTouches[0].clientX-tx0;if(Math.abs(d)>40)go(d<0?1:-1);auto()};mv();auto()}
function auto(){clearInterval(ct);if(!matchMedia('(prefers-reduced-motion:reduce)').matches)ct=setInterval(()=>go(1),5000)}

const hs=(a,b)=>{let x=Math.imul(a,73856093)^Math.imul(b,19349663);x=Math.imul(x^(x>>>13),1274126177);return((x^(x>>>16))>>>0)/4294967296};
function genAns(v,target){const F=flat(v.st),sc1=ty=>AT[ty].find(a=>a[2]===1)[0],sc5=ty=>{const a=AT[ty].find(a=>a[2]===.5);return a&&a[0]},sc0=ty=>AT[ty].find(a=>a[2]===0)[0];
const out={},it=[];F.forEach(f=>{if(f.ty=='cmp'&&hs(v.id,f.i+500)<.03){out[f.k]='x'}else it.push(f)});
const W=it.reduce((a,f)=>a+f.w,0);let rem=target/100*W;const ord=it.slice().sort((a,b)=>hs(v.id,a.i)-hs(v.id,b.i)),mark={};
ord.forEach(f=>{if(target<88&&sc5(f.ty)&&hs(v.id,f.i+900)<.15&&rem>=f.w/2){mark[f.k]=.5;rem-=f.w/2}});
ord.forEach(f=>{if(mark[f.k])return;if(rem>=f.w){mark[f.k]=1;rem-=f.w}else mark[f.k]=0});
ord.filter(f=>mark[f.k]===0).sort((a,b)=>a.w-b.w||hs(v.id,a.i)-hs(v.id,b.i)).forEach(f=>{if(rem>=f.w){mark[f.k]=1;rem-=f.w}});
ord.filter(f=>mark[f.k]===0).forEach(f=>{if(sc5(f.ty)&&rem>=f.w/4){mark[f.k]=.5;rem-=f.w/2}else if(!sc5(f.ty)&&rem>=f.w*.5){mark[f.k]=1;rem-=f.w}});
it.forEach(f=>{out[f.k]=mark[f.k]===1?sc1(f.ty):mark[f.k]===.5?sc5(f.ty):sc0(f.ty)});return out}
function calcSc(v){let tot=0,n=0;flat(v.st).forEach(f=>{const a=AT[f.ty].find(x=>x[0]==v.ans[f.k]);if(a&&a[2]!=null){tot+=a[2]*f.w;n+=f.w}});return Math.round(tot/(n||1)*100)}
function mig(){S.visits.forEach(v=>{const i=v.id-1000;if(i<0||i>25)return;const p=n=>String(n).padStart(2,'0');
if(v.s=='submitted'){v.d=MONTHS[i%12]+'-'+p(1+(i*7)%27);if(!v.ans||!Object.keys(v.ans).length){v.ans=genAns(v,v.sc0||v.sc);v.sc0=v.sc;v.sc=calcSc(v)}}
else if(v.s=='draft')v.d='2026-11-0'+(3+(i-20));else v.d=['2026-11-10','2026-11-12','2026-11-17'][i-23]||v.d});S.dv=2;save()}

function hok(id){const x=S.tasks.find(y=>y.id==id);x.hres=true;if(x.col=='todo')x.col='rvw';x.pf=PF?[PF]:[];x.cm=x.cm||[];if(hc.value)x.cm.push({w:'hotel',t:hc.value});S.aud.unshift({w:S.user,t:'now',a:'hotel resolved #'+id});save();cm();portal()}
function sam(){PF=null;mod(`<h3>${t('self')}</h3>${flat().map(f=>`<div class="q"><div>${f.q}</div><select class="sai" data-k="${f.k}"><option value="">-</option>${AT[f.ty].map(a=>`<option value="${a[0]}">${isNaN(a[0])?t(a[1]):a[1]}</option>`).join('')}</select></div>`).join('')}<label>${t('proof')}</label><input type="file" accept="image/*" capture="environment" onchange="pcp(this,p=>{PF=p;$('#pfi').innerHTML=pinf(p)})"><div id="pfi"></div><div class="rv"><button class="btn p" onclick="sas()">${t('save')}</button><button class="btn" onclick="cm()">${t('cancel')}</button></div>`)}
function sas(){const h=USERS[S.user].h,a={};document.querySelectorAll('.sai').forEach(e=>{if(e.value)a[e.dataset.k]=e.value});SA()[h]={ans:a,t:new Date().toLocaleString(),ph:PF?[PF]:[]};S.aud.unshift({w:S.user,t:'now',a:'self-assessment'});save();cm();portal()}
/* REPORTS */
function rps(){const V=S.visits.filter(v=>v.s=='submitted');$('#scr').innerHTML=`<div class="card tw"><table><tr><th>#</th><th>${t('est')}</th><th>${t('stage')}</th><th>${t('date')}</th><th>${t('score')}</th><th>${t('bil')}</th></tr>${V.map(v=>`<tr><td>${v.id}</td><td>${hn(v.h)}</td><td>${stN(v.st)}</td><td>${v.d}</td><td>${sc(v.sc)}</td><td><div class="opt"><button class="btn" onclick="rview(${v.id},'ar')">AR</button><button class="btn" onclick="rview(${v.id},'en')">EN</button></div></td></tr>`).join('')}</table></div>`}
function rview(id,L){const v=S.visits.find(x=>x.id==id),F=flat(v.st),d=D[L];mod(`<div id="rp" dir="${L=='ar'?'rtl':'ltr'}"><div style="display:flex;justify-content:space-between;align-items:center">${logo}<b>${d.sr} #${v.id}</b></div><h3>${H[v.h][L=='ar'?0:1]} - ${d['p'+v.st]||stN(v.st)}</h3><p>${d.date}: ${v.d} | ${d.insp1}: ${INS[v.ins].n} | ${d.score}: <b>${v.sc}%</b></p><div class="tw"><table><tr><th>#</th><th>${d.item}</th><th>${d.ans}</th></tr>${F.map((f,i)=>{const a=AT[f.ty].find(x=>x[0]==ansOf(v,f));return`<tr><td>${i+1}</td><td style="white-space:normal">${L=='ar'?f.q:(EQ[f.i]||f.q)}</td><td>${a?(isNaN(a[0])?d[a[1]]:a[1]):'-'}</td></tr>`}).join('')}</table></div><p>${d.sign}: ____________ &nbsp; ____________</p></div><div class="rv"><button class="btn p" onclick="rp()">${t('prt')}</button><button class="btn" onclick="cm()">${t('close')}</button></div>`)}
function rp(){document.body.classList.add('pr');window.print();setTimeout(()=>document.body.classList.remove('pr'),600)}
/* TEMPLATES */
const TYN={pct:'≥90 / 50 / ≤10',cmp:'C / P / NC / NA',met:'Met / Partial / Not met',bin:'C / NC'};
function tpl(){const T=TP();$('#scr').innerHTML=`<div class="rv" style="margin-bottom:12px"><button class="btn p" onclick="nst()">${t('nstg')}</button></div><div class="card tw"><table><tr><th>${t('stage')}</th><th>${t('ver')}</th><th>${t('sec')}</th><th>${t('qq')}</th><th></th></tr>${T.map((x,i)=>`<tr><td>${stN(i+1)}</td><td>v${x.v}</td><td>${x.secs.length}</td><td>${x.secs.reduce((a,s)=>a+s.q.length,0)}</td><td><div class="opt"><button class="btn" onclick="tpv(${i})">${t('prev')}</button><button class="btn" onclick="tpb(${i})">${t('bld')}</button><button class="btn" onclick="tph(${i})">${t('hist')}</button></div></td></tr>`).join('')}</table></div>`}
function tpv(i){const x=TP()[i];mod(`<h3>${stN(i+1)} - v${x.v}</h3>${x.secs.map(s=>`<h4 class="ac">${s.t}</h4>${s.q.map(q=>`<div class="q">${q[0]} <span class="chip mu">${TYN[q[1]]}</span> <span class="chip wn">×${q[2]||1}</span></div>`).join('')||'<p class="mu">-</p>'}`).join('')}<div class="rv"><button class="btn" onclick="cm()">${t('close')}</button></div>`)}
function tph(i){const x=TP()[i];mod(`<h3>${t('hist')} - ${stN(i+1)}</h3>${x.hist.slice().reverse().map(h=>`<div class="q">v${h.v} | ${h.d} | ${h.c}</div>`).join('')}<div class="rv"><button class="btn" onclick="cm()">${t('close')}</button></div>`)}
function tpb(i){const x=TP()[i];mod(`<h3>${t('bld')} - ${stN(i+1)}</h3><label>${t('sec')}</label><select id="bs">${x.secs.map((s,j)=>`<option value="${j}">${s.t}</option>`).join('')}<option value="-1">+ ${t('nsec')}</option></select><input id="bn" placeholder="${t('nsec')}" style="margin-top:6px"><label>${t('qq')}</label><input id="bq"><label>${t('ty')}</label><select id="bt">${Object.keys(TYN).map(k=>`<option value="${k}">${TYN[k]}</option>`).join('')}</select><label>${t('wt')}</label><input id="bw" type="number" min="1" max="5" value="1"><div class="rv"><button class="btn p" onclick="tps(${i})">${t('save')}</button><button class="btn" onclick="cm()">${t('cancel')}</button></div>`)}
function tps(i){const x=TP()[i];if(!bq.value.trim())return;let j=+bs.value;if(j<0){x.secs.push({t:bn.value||'-',q:[]});j=x.secs.length-1}x.secs[j].q.push([bq.value,bt.value,+bw.value||1]);x.v++;x.hist.push({v:x.v,d:new Date().toISOString().slice(0,10),c:'+ '+bq.value});S.aud.unshift({w:S.user,t:'now',a:'template '+stN(i+1)+' v'+x.v});save();cm();tpl();toast('v'+x.v)}
function nst(){mod(`<h3>${t('nstg')}</h3><label>${t('name')}</label><input id="nn"><div class="rv"><button class="btn p" onclick="if(!nn.value.trim())return;TP().push({k:'c',n:nn.value,v:1,hist:[{v:1,d:new Date().toISOString().slice(0,10),c:'Initial'}],secs:[{t:'عام',q:[]}]});S.aud.unshift({w:S.user,t:'now',a:'new stage '+nn.value});save();cm();tpl()">${t('save')}</button><button class="btn" onclick="cm()">${t('cancel')}</button></div>`)}
load();draw();
</script></body></html>
